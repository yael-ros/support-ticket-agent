[project]
name = "support-ticket-agent"
version = "0.1.0"
description = "RAG-powered customer support ticket agent (portfolio project)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "datasets>=2",
    "sentence-transformers>=5",
    "chromadb>=1",
]

# Phase 1 + 2 deps. Later phases add: langgraph, anthropic, tenacity,
# structlog, fastapi, uvicorn.

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["support_agent"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
