[project]
name = "support-ticket-agent"
version = "0.1.0"
description = "RAG-powered customer support ticket agent (portfolio project)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "datasets>=2",
    "sentence-transformers>=5",
    "chromadb>=1",
    "anthropic>=0.122",  # <0.122 lacks output_config (structured outputs) as a typed param — confirmed 0.72.1 doesn't have it, 0.122.0 does
    "google-genai>=1",
    "tenacity>=9",
    "python-dotenv>=1",
    "langgraph>=1.2",
]

# Phase 1 + 2 + 3 + 4 deps. Later phases add: structlog, fastapi, uvicorn.

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["support_agent"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
